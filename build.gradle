plugins {
	id 'fabric-loom' version '1.6-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
var modules = ['accessors', 'base', 'blocks', 'client_events', 'common', 'core', 'data', 'entity', 'extensions', 'fluids',
           'gui_utils', 'items', 'lazy_registration', 'level_events', 'loot', 'model_builders', 'model_loader',
			'model_materials', 'models', 'networking', 'obj_loader', 'recipe_book_categories', 'registries', 'tags', 'transfer',
		   'utility']

base {
	archivesName = project.archives_base_name
}

loom {
	accessWidenerPath = project.file("src/main/resources/oreganized.accesswidener")
}

repositories {
	maven {
		name = 'ParchmentMC'
		url = 'https://maven.parchmentmc.org'
	}
	maven {
		name = 'Quilt'
		url = "https://maven.quiltmc.org/repository/release/"
	}
	maven {
		name = "DevOS"
		url = "https://mvn.devos.one/releases/"
	}

	maven {
		name = "JamiesWhiteShirt"
		url = "https://maven.jamieswhiteshirt.com/libs-release"
		content {
			includeGroup "com.jamieswhiteshirt"
		}
	}

	maven {
		name = "Fuzs Mod Resources"
		url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
	}

	mavenCentral()
}

fabricApi {
	configureDataGeneration()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.layered() {
		mappings("org.quiltmc:quilt-mappings:${project.minecraft_version}+build.${project.qm_version}:intermediary-v2")
		parchment("org.parchmentmc.data:parchment-${project.parchment_version}@zip")
		officialMojangMappings()
	}
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Dependencies
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${project.forge_config_version}"

	for(port_lib in modules ) {
		modImplementation(include("io.github.fabricators_of_create.Porting-Lib:${port_lib}:${project.port_lib_version}"))
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
	repositories {
		maven {
			name "sapphoCompany"
			url "https://maven.is-immensely.gay/nightly"
			credentials(org.gradle.api.credentials.PasswordCredentials)
			authentication {
				basic(BasicAuthentication)
			}
		}
	}
}
